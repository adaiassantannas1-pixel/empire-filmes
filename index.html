<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Empire Filmes</title>

<style>

/* =========================
   BASE
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
}

button{
    cursor:pointer;
}

input,
select,
textarea{
    font-family:Arial,sans-serif;
}

.app{
    max-width:600px;
    margin:auto;
    padding-bottom:90px;
}


/* =========================
   HEADER
========================= */

header{
    height:60px;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.logo span{
    color:#e50914;
}

header button{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#222;
    color:#fff;
    font-size:18px;
}


/* =========================
   PAGINAS
========================= */

.page{
    display:none;
    padding:15px;
}

.page.active{
    display:block;
}


/* =========================
   HERO
========================= */

.hero{
    height:320px;
    border-radius:15px;
    overflow:hidden;
    position:relative;

    background:
    linear-gradient(to top,#050505,transparent),
    url("https://upload.wikimedia.org/wikipedia/commons/7/70/Big.Buck.Bunny.-.Opening.png")
    center/cover;
}

.heroText{
    position:absolute;
    left:18px;
    right:18px;
    bottom:20px;
}

.hero h1{
    font-size:28px;
    margin:8px 0;
}

.hero p{
    color:#ddd;
    font-size:13px;
}


/* =========================
   BOTOES
========================= */

.watch{
    margin-top:14px;
    padding:12px 18px;
    border:0;
    border-radius:8px;
    background:#fff;
    color:#000;
    font-weight:bold;
}

.full{
    width:100%;
}

.favorite{
    width:100%;
    margin-top:8px;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#222;
    color:#fff;
}

.back{
    background:none;
    border:0;
    color:#fff;
    font-size:16px;
    margin-bottom:15px;
}

.redButton{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#e50914;
    color:#fff;
    font-weight:bold;
}

.grayButton{
    padding:10px 12px;
    border:0;
    border-radius:7px;
    background:#333;
    color:#fff;
}


/* =========================
   SECOES
========================= */

.section{
    margin-top:25px;
}

.section h2{
    font-size:19px;
    margin-bottom:12px;
}


/* =========================
   CARDS
========================= */

.cards{
    display:flex;
    gap:12px;
    overflow-x:auto;
}

.card{
    min-width:125px;
    cursor:pointer;
}

.card img{
    width:125px;
    height:180px;
    object-fit:cover;
    border-radius:9px;
    background:#222;
}

.card h3{
    font-size:13px;
    margin-top:6px;
}

.card p{
    color:#888;
    font-size:11px;
    margin-top:4px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.grid .card{
    min-width:0;
}

.grid .card img{
    width:100%;
    height:190px;
}


/* =========================
   PESQUISA
========================= */

.search{
    display:flex;
    gap:8px;
    margin:15px 0 20px;
}

.search input{
    flex:1;
    padding:13px;
    background:#191919;
    color:#fff;
    border:1px solid #333;
    border-radius:8px;
    outline:none;
}

.search button{
    width:50px;
    background:#e50914;
    color:#fff;
    border:0;
    border-radius:8px;
}


/* =========================
   DETALHES
========================= */

.detail img{
    width:100%;
    height:300px;
    object-fit:cover;
    border-radius:14px;
}

.detail h1{
    margin-top:15px;
    font-size:27px;
}

.meta{
    color:#888;
    margin:8px 0;
}

.description{
    color:#ddd;
    line-height:1.5;
    font-size:14px;
}


/* =========================
   PLAYER
========================= */

video{
    width:100%;
    min-height:220px;
    background:#000;
    border-radius:10px;
}

.playerTitle{
    margin-top:15px;
}

.playerTitle p{
    color:#888;
    margin-top:5px;
}


/* =========================
   PERFIL
========================= */

.profile{
    text-align:center;
    padding-top:30px;
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-size:40px;
}

.profile h2{
    margin-top:15px;
}

.profile p{
    color:#888;
    margin-top:5px;
}

.profile button{
    width:100%;
    margin-top:10px;
    padding:15px;
    background:#181818;
    color:#fff;
    border:1px solid #292929;
    border-radius:8px;
    text-align:left;
}


/* =========================
   MENU
========================= */

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:600px;
    height:68px;
    background:#111;
    border-top:1px solid #292929;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.bottom button{
    background:none;
    border:0;
    color:#888;
    font-size:10px;
}

.bottom button span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}


/* =========================
   ADMIN
========================= */

.adminBox{
    background:#151515;
    padding:15px;
    border-radius:14px;
}

.adminBox label{
    display:block;
    color:#aaa;
    font-size:12px;
    margin-bottom:6px;
}

.adminBox input,
.adminBox select,
.adminBox textarea{
    width:100%;
    padding:13px;
    margin-bottom:14px;
    background:#222;
    color:#fff;
    border:1px solid #333;
    border-radius:8px;
    outline:none;
}

.adminBox textarea{
    height:90px;
    resize:none;
}

.adminItem{
    background:#181818;
    padding:14px;
    border-radius:10px;
    margin-bottom:10px;
}

.adminItem h3{
    margin-bottom:7px;
}

.adminItem p{
    color:#888;
    font-size:13px;
}

.adminItem button{
    margin-top:8px;
    margin-right:4px;
}


/* =========================
   SERIES
========================= */

.seriesHeader{
    background:#151515;
    padding:15px;
    border-radius:12px;
}

.seriesHeader img{
    width:100%;
    height:260px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:12px;
}

.seasonTitle{
    margin-top:20px;
    margin-bottom:8px;
}

.episode{
    background:#181818;
    border-radius:10px;
    padding:13px;
    margin-top:8px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.episodeInfo{
    flex:1;
}

.episodeInfo strong{
    display:block;
    font-size:14px;
}

.episodeInfo small{
    display:block;
    color:#888;
    margin-top:5px;
}

.episodePlay{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#e50914;
    color:#fff;
    font-size:17px;
}


/* =========================
   VAZIO
========================= */

.empty{
    text-align:center;
    color:#888;
    padding:45px 10px;
}


/* =========================
   RESPONSIVO
========================= */

@media(max-width:380px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>


<body>

EMPIRE <span>FILMES</span>

<script>


/* =========================
   VIDEO DE TESTE
========================= */

const VIDEO_TESTE =
"https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4";


/* =========================
   FILMES
========================= */

const movies = [

{
title:"Big Buck Bunny",

category:"Animação",

year:"2008",

duration:"10 segundos",

description:
"Vídeo público de demonstração para testar o player.",

image:
"https://upload.wikimedia.org/wikipedia/commons/7/70/Big.Buck.Bunny.-.Opening.png",

video:VIDEO_TESTE

},

{
title:"Projeto Eclipse",

category:"Ação",

year:"2026",

duration:"1h 48min",

description:
"Filme fictício de demonstração.",

image:
"https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=700&q=80",

video:VIDEO_TESTE

},

{
title:"Noite Sombria",

category:"Terror",

year:"2026",

duration:"1h 35min",

description:
"Filme fictício de demonstração.",

image:
"https://images.unsplash.com/photo-1509248961158-e54f6934749c?auto=format&fit=crop&w=700&q=80",

video:VIDEO_TESTE

}

];


let currentMovie = null;

let currentSeries = null;

let previousPage = "home";


/* =========================
   NAVEGAÇÃO
========================= */

function go(page){

document
.querySelectorAll(".page")
.forEach(function(p){

p.classList.remove("active");

});


const selected =
document.getElementById(page);


if(selected){

selected.classList.add("active");

}


window.scrollTo(0,0);

}


/* =========================
   FILMES
========================= */

function createCard(movie,index){

return `

<div
class="card"
onclick="openMovie(${index})">

<img
src="${movie.image}"
alt="${movie.title}">

<h3>
${movie.title}
</h3>

<p>
${movie.category} • ${movie.year}
</p>

</div>

`;

}


function renderHome(){

const box =
document.getElementById("homeCards");

box.innerHTML="";


movies.forEach(function(movie,index){

box.innerHTML +=
createCard(movie,index);

});

}


function renderExplore(list){

const box =
document.getElementById("exploreCards");

box.innerHTML="";


if(list.length===0){

box.innerHTML=
'<div class="empty" style="grid-column:1/-1">Nenhum resultado encontrado.</div>';

return;

}


list.forEach(function(movie){

const index =
movies.indexOf(movie);

box.innerHTML +=
createCard(movie,index);

});

}


function searchAll(){

const text =
document
.getElementById("searchInput")
.value
.toLowerCase()
.trim();


const result =
movies.filter(function(movie){

return movie.title
.toLowerCase()
.includes(text)

||

movie.category
.toLowerCase()
.includes(text);

});


renderExplore(result);

}


/* =========================
   DETALHE FILME
========================= */

function openMovie(index){

const movie =
movies[index];

if(!movie)return;


currentMovie=index;


document
.getElementById("detailImage")
.src=movie.image;


document
.getElementById("detailTitle")
.textContent=movie.title;


document
.getElementById("detailMeta")
.textContent=
movie.category+
" • "+
movie.year+
" • "+
movie.duration;


document
.getElementById("detailDescription")
.textContent=
movie.description;


go("detalhes");

}


function playCurrent(){

if(currentMovie !== null){

playMovie(currentMovie);

}

}


function playMovie(index){

const movie =
movies[index];

if(!movie)return;


currentMovie=index;

previousPage="detalhes";


const video =
document.getElementById("videoPlayer");


video.pause();

video.removeAttribute("src");

video.load();

video.src=movie.video;

video.load();


document
.getElementById("playerTitle")
.textContent=movie.title;


go("player");

}


/* =========================
   FAVORITOS
========================= */

function getFavorites(){

try{

return JSON.parse(
localStorage.getItem("empireFavorites")
||"[]"
);

}catch(e){

return [];

}

}


function saveFavorites(list){

localStorage.setItem(
"empireFavorites",
JSON.stringify(list)
);

}


function addFavorite(){

if(currentMovie===null)return;


const movie =
movies[currentMovie];


let favorites =
getFavorites();


if(!favorites.includes(movie.title)){

favorites.push(movie.title);

saveFavorites(favorites);

alert("Adicionado aos favoritos ❤️");

}else{

alert("Esse filme já está nos favoritos.");

}


renderFavorites();

}


function renderFavorites(){

const box =
document.getElementById("favoriteCards");

const favorites =
getFavorites();

box.innerHTML="";


if(favorites.length===0){

box.innerHTML=
'<div class="empty" style="grid-column:1/-1">❤️<br><br>Nenhum favorito ainda.</div>';

return;

}


favorites.forEach(function(title){

const index =
movies.findIndex(function(movie){

return movie.title===title;

});


if(index>=0){

box.innerHTML +=
createCard(movies[index],index);

}

});

}


/* =========================
   SERIES
========================= */

function getSeries(){

try{

return JSON.parse(
localStorage.getItem("empire_series")
||"[]"
);

}catch(e){

return [];

}

}


function saveSeries(series){

localStorage.setItem(
"empire_series",
JSON.stringify(series)
);

}


function createSeriesCard(serie,index){

return `

<div
class="card"
onclick="openSeries(${index})">

<img
src="${serie.image}"
alt="${serie.title}">

<h3>
${serie.title}
</h3>

<p>
${serie.category} • ${serie.year}
</p>

</div>

`;

}


function renderSeries(){

const series =
getSeries();


const box =
document.getElementById("seriesCards");

box.innerHTML="";


if(series.length===0){

box.innerHTML=
'<div class="empty" style="grid-column:1/-1">📺<br><br>Nenhuma série cadastrada.</div>';

}else{

series.forEach(function(serie,index){

box.innerHTML +=
createSeriesCard(serie,index);

});

}


/* HOME */

const home =
document.getElementById("homeSeries");

home.innerHTML="";


series
.slice(0,10)
.forEach(function(serie,index){

home.innerHTML +=
createSeriesCard(serie,index);

});

}


/* =========================
   ABRIR SERIE
========================= */

function openSeries(index){

const series =
getSeries();

const serie =
series[index];

if(!serie)return;


currentSeries=index;


document
.getElementById("serieDetailImage")
.src=serie.image;


document
.getElementById("serieDetailTitle")
.textContent=serie.title;


document
.getElementById("serieDetailMeta")
.textContent=
serie.category+
" • "+
serie.year;


document
.getElementById("serieDetailDescription")
.textContent=
serie.description;


renderEpisodes(serie);


go("serieDetalhes");

}


/* =========================
   EPISODIOS
========================= */

function renderEpisodes(serie){

const box =
document.getElementById("episodeList");

box.innerHTML="";


if(!serie.episodes ||
serie.episodes.length===0){

box.innerHTML=
'<div class="empty">🎬<br><br>Nenhum episódio cadastrado nesta série.</div>';

return;

}


const seasons={};


serie.episodes.forEach(function(ep){

if(!seasons[ep.season]){

seasons[ep.season]=[];

}

seasons[ep.season].push(ep);

});


Object.keys(seasons)
.sort(function(a,b){

return Number(a)-Number(b);

})
.forEach(function(season){


box.innerHTML +=
`
<h3 class="seasonTitle">
Temporada ${season}
</h3>
`;


seasons[season]
.sort(function(a,b){

return Number(a.number)-Number(b.number);

})
.forEach(function(ep){


const episodeIndex =
serie.episodes.indexOf(ep);


box.innerHTML += `

<div class="episode">

<div class="episodeInfo">

<strong>
Episódio ${ep.number} — ${ep.title}
</strong>

<small>
Temporada ${ep.season}
</small>

</div>


<button
class="episodePlay"
onclick="playEpisode(${currentSeries},${episodeIndex})">

▶

</button>

</div>

`;

});

});

}


/* =========================
   PLAYER EPISODIO
========================= */

function playEpisode(seriesIndex,episodeIndex){

const series =
getSeries();

const serie =
series[seriesIndex];

if(!serie)return;


const episode =
serie.episodes[episodeIndex];

if(!episode)return;


previousPage="serieDetalhes";


const video =
document.getElementById("videoPlayer");


video.pause();

video.removeAttribute("src");

video.load();

video.src=episode.video;

video.load();


document
.getElementById("playerTitle")
.textContent=
"EP "+
episode.number+
" — "+
episode.title;


go("player");

}


function backPlayer(){

go(previousPage);

}


/* =========================
   ADMIN
========================= */

function openAdmin(){

const pin =
prompt(
"Digite o PIN do administrador:"
);


if(pin !== "123456"){

alert("PIN incorreto.");

return;

}


renderAdmin();

go("admin");

}


function renderAdmin(){

getSeries();


const box =
document.getElementById("adminSeriesList");

box.innerHTML="";


if(series.length===0){

box.innerHTML=
'<div class="empty">📺<br><br>Nenhuma série cadastrada.</div>';

series.forEach(function(serie,index){

const episodes =
serie.episodes
?
serie.episodes.length
:
0;


box.innerHTML += `

<div class="adminItem">

<h3>
📺 ${serie.title}
</h3>

<p>
${serie.category} • ${serie.year}
</p>

<p>
🎬 ${episodes} episódio(s)
</p>


<button
class="grayButton"
onclick="prepareEpisode(${index})">

</button>

class="grayButton"

class="grayButton"

🗑 Excluir

});

   CADASTRAR SERIE
========================= */

function addSeries(){

const title =
document
.getElementById("seriesName")
.value
.trim();


const category =
document
.getElementById("seriesCategory")
.value;


const year =
document
.getElementById("seriesYear")
.value
.trim();


const image =
document
.getElementById("seriesImage")
.value
.trim();


const description =
document
.getElementById("seriesDescription")
.value
.trim();


if(!title){

.getElementById("seriesName")

/* =========================
   PREPARAR EPISODIO
========================= */

function prepareEpisode(seriesIndex){

const series =
getSeries();


if(!series[seriesIndex]){

return;

}


const select =
document.getElementById("episodeSeries");


select.innerHTML="";


series.forEach(function(serie,index){

const option =
document.createElement("option");


option.value=index;

option.textContent=serie.title;


select.appendChild(option);

});


select.value=seriesIndex;


document
.getElementById("episodeSeason")
.value="1";


document
.getElementById("episodeNumber")
.value="1";


document
.getElementById("episodeTitle")
.value="";


document
.getElementById("episodeVideo")
.value="";


go("cadastroEpisodio");

}


/* =========================
   CADASTRAR EPISODIO
========================= */

function addEpisode(){

const seriesIndex =
Number(
document
.getElementById("episodeSeries")
.value
);


const season =
Number(
document
.getElementById("episodeSeason")
.value
);


const number =
Number(
document
.getElementById("episodeNumber")
.value
);


const title =
document
.getElementById("episodeTitle")
.value
.trim();


const video =
document
.getElementById("episodeVideo")
.value
.trim();


if(!title){

alert("Digite o título do episódio.");

return;

}


if(!video){

alert("Cole a URL do vídeo.");

return;

}


if(!season || season<1){

alert("Informe uma temporada válida.");

return;

}


if(!number || number<1){

alert("Informe um número de episódio válido.");

return;

}


const series =
getSeries();


const serie =
series[seriesIndex];


if(!serie){

alert("Série não encontrada.");

return;

}


if(!serie.episodes){

serie.episodes=[];

}


/* EVITAR EPISODIO DUPLICADO */

const exists =
serie.episodes.some(function(ep){

return Number(ep.season)===season
&&
Number(ep.number)===number;

});


if(exists){

alert(
"Esse episódio já existe nessa temporada."
);

return;

}


serie.episodes.push({

season:season,

number:number,

title:title,

video:video

});


saveSeries(series);


renderSeries();

renderAdmin();


document
.getElementById("episodeTitle")
.value="";


document
.getElementById("episodeVideo")
.value="";


alert(
"🎬 Episódio salvo com sucesso!"
);


go("admin");

}


/* =========================
   EXCLUIR SERIE
========================= */

function deleteSeries(index){

const series =
getSeries();


const serie =
series[index];


if(!serie)return;


const confirmed =
confirm(
'Excluir a série "'+
serie.title+
'" e todos os seus episódios?'
);


if(!confirmed){

return;

}


series.splice(index,1);


saveSeries(series);


renderSeries();

renderAdmin();


alert(
"🗑 Série excluída."
);

}


/* =========================
   INICIALIZAÇÃO
========================= */

renderHome();

renderExplore(movies);

renderFavorites();

renderSeries();

</script>
